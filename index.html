<!DOCTYPE html>
<html lang="da">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>M&B — Havepleje & Bilrengøring</title>
  <meta name="description" content="M&B tilbyder professionel havepleje og indvendig bilrengøring. Vælg din service.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BGMWC7Q1SR"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BGMWC7Q1SR');
  </script>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --cream: #FAF3EA;
      --ink: #1C1B19;
      --accent: #3E4A3D;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Inter", -apple-system, sans-serif;
    }
    html, body { height: 100%; font-family: var(--sans); }

    .split-wrap {
      display: flex;
      height: 100vh;
      min-height: 600px;
    }

    .split-side {
      flex: 1;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      overflow: hidden;
      transition: flex 0.5s ease;
      cursor: pointer;
    }
    .split-side:hover { flex: 1.35; }

    .split-side .bg {
      position: absolute;
      inset: 0;
      background-size: cover;
      background-position: center;
      transition: transform 0.6s ease;
    }
    .split-side:hover .bg { transform: scale(1.04); }

    .split-side .overlay {
      position: absolute;
      inset: 0;
      background: rgba(28,27,25,0.45);
      transition: background 0.4s ease;
    }
    .split-side:hover .overlay { background: rgba(28,27,25,0.3); }

    .split-side .content {
      position: relative;
      z-index: 1;
      text-align: center;
      color: #fff;
      padding: 40px 32px;
    }

    .split-side .eyebrow {
      font-family: var(--sans);
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.7);
      margin-bottom: 16px;
    }

    .split-side h2 {
      font-family: var(--serif);
      font-size: clamp(2.2rem, 4.5vw, 3.5rem);
      font-weight: 400;
      line-height: 1.1;
      margin-bottom: 18px;
      color: #fff;
    }

    .split-side p {
      font-size: 15px;
      color: rgba(255,255,255,0.8);
      max-width: 280px;
      margin: 0 auto 32px;
      line-height: 1.7;
    }

    .split-btn {
      display: inline-block;
      font-family: var(--sans);
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 14px 30px;
      border: 1px solid rgba(255,255,255,0.8);
      color: #fff;
      background: transparent;
      transition: all 0.25s ease;
    }
    .split-side:hover .split-btn {
      background: #fff;
      color: var(--ink);
      border-color: #fff;
    }

    .divider {
      position: relative;
      width: 1px;
      background: rgba(255,255,255,0.25);
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .divider-logo {
      position: absolute;
      background: rgba(250,243,234,0.95);
      border-radius: 50%;
      width: 92px;
      height: 92px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 11;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
    }
    .divider-logo img {
      filter: none;
      width: 74px;
      height: 74px;
      object-fit: contain;
    }

    /* Have-siden: grøn have */
    .side-have .bg {
      background-image: url('images/forside-1.webp');
    }

    /* Bil-siden: mørk neutral */
    .side-bil .bg {
      background-image: url('images/forside-bil.webp');
      background-position: center 60%;
    }

    /* Mobil */
    @media (max-width: 700px) {
      .split-wrap { flex-direction: column; height: auto; min-height: 100vh; }
      .split-side { min-height: 50vh; flex: 1 !important; }
      .divider { width: 100%; height: 1px; }
      .divider-logo { top: 50%; transform: translateY(-50%); }
    }
  </style>
</head>
<body>

  <div class="split-wrap">

    <!-- Havepleje -->
    <a class="split-side side-have" href="have.html">
      <div class="bg"></div>
      <div class="overlay"></div>
      <div class="content">
        <p class="eyebrow">Have & Ejendom</p>
        <h2>Havepleje</h2>
        <p>Græsslåning, hækklipning, fliserens og meget mere — vi passer din have.</p>
        <span class="split-btn">Gå til havepleje</span>
      </div>
    </a>

    <!-- Skillelinje med logo -->
    <div class="divider">
      <div class="divider-logo">
        <img src="images/Nyt logo sort.png" alt="M&B">
      </div>
    </div>

    <!-- Bilrengøring -->
    <a class="split-side side-bil" href="bilrengoring.html">
      <div class="bg"></div>
      <div class="overlay"></div>
      <div class="content">
        <p class="eyebrow">Efterår & Vinter</p>
        <h2>Bilrengøring</h2>
        <p>Indvendig bilrengøring — vi kommer til dig og gør din bil klar indefra.</p>
        <span class="split-btn">Gå til bilrengøring</span>
      </div>
    </a>

  </div>

</body>
</html>
